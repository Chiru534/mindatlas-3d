<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="60%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>
    <radialGradient id="cyanIsland" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </radialGradient>
    <radialGradient id="emeraldIsland" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#10b981"/>
    </radialGradient>
    <radialGradient id="purpleIsland" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </radialGradient>
    <radialGradient id="roseIsland" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="80%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="960" height="540" fill="url(#skyGrad)"/>

  <!-- Star field particles -->
  <g fill="#94a3b8" opacity="0.6">
    <circle cx="80" cy="90" r="1.5"/><circle cx="160" cy="40" r="1"/><circle cx="280" cy="110" r="1.2"/>
    <circle cx="420" cy="50" r="1.8"/><circle cx="560" cy="80" r="1"/><circle cx="710" cy="35" r="1.5"/>
    <circle cx="840" cy="95" r="1.2"/><circle cx="910" cy="45" r="1.6"/><circle cx="120" cy="220" r="1"/>
    <circle cx="870" cy="230" r="1.4"/><circle cx="70" cy="410" r="1.5"/><circle cx="880" cy="430" r="1.2"/>
  </g>

  <!-- Road Highways (Catmull-Rom Beams) -->
  <path d="M 270 210 Q 480 180 690 210" stroke="#38bdf8" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="6 4"/>
  <path d="M 270 210 Q 260 300 270 390" stroke="#a855f7" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="6 4"/>
  <path d="M 690 210 Q 700 300 690 390" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="6 4"/>
  <path d="M 270 390 Q 480 430 690 390" stroke="#f43f5e" stroke-width="2.5" fill="none" opacity="0.7" stroke-dasharray="6 4"/>

  <!-- Island 1: Frontend Archipelago (NW) -->
  <g transform="translate(270, 210)">
    <ellipse cx="0" cy="10" rx="130" ry="60" fill="url(#cyanIsland)" stroke="#06b6d4" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="60" ry="25" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
    <text x="0" y="45" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">FRONTEND ARCHIPELAGO</text>
    <!-- Landmarks -->
    <circle cx="-50" cy="-5" r="9" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
    <circle cx="0" cy="5" r="9" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
    <circle cx="50" cy="-10" r="9" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
  </g>

  <!-- Island 2: Backend Citadel (NE) -->
  <g transform="translate(690, 210)">
    <ellipse cx="0" cy="10" rx="130" ry="60" fill="url(#emeraldIsland)" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="60" ry="25" fill="none" stroke="#10b981" stroke-width="1" opacity="0.4"/>
    <text x="0" y="45" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">BACKEND CITADEL</text>
    <!-- Landmarks -->
    <circle cx="-50" cy="-5" r="9" fill="#fbbf24" stroke="#fef08a" stroke-width="2"/>
    <circle cx="10" cy="8" r="9" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="60" cy="-5" r="9" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Island 3: AI & Neural Sanctuary (SW) -->
  <g transform="translate(270, 390)">
    <ellipse cx="0" cy="10" rx="130" ry="60" fill="url(#purpleIsland)" stroke="#a855f7" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="60" ry="25" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.4"/>
    <text x="0" y="45" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">AI &amp; NEURAL SANCTUARY</text>
    <!-- Landmarks -->
    <circle cx="-40" cy="0" r="9" fill="#06b6d4" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="20" cy="-8" r="9" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="50" cy="12" r="9" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Island 4: Cybersecurity Bastion (SE) -->
  <g transform="translate(690, 390)">
    <ellipse cx="0" cy="10" rx="130" ry="60" fill="url(#roseIsland)" stroke="#f43f5e" stroke-width="2"/>
    <ellipse cx="0" cy="10" rx="60" ry="25" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.4"/>
    <text x="0" y="45" fill="#fb7185" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">CYBERSECURITY BASTION</text>
    <!-- Landmarks -->
    <circle cx="-30" cy="-5" r="9" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="30" cy="5" r="9" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  </g>

  <!-- Top HUD Bar Mockup -->
  <g transform="translate(30, 20)">
    <rect width="900" height="48" rx="12" fill="#0f172a" opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Logo -->
    <text x="24" y="30" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="extrabold">MINDATLAS 3D</text>
    <rect x="140" y="16" width="105" height="18" rx="9" fill="#9333ea" opacity="0.25" stroke="#c084fc" stroke-width="1"/>
    <text x="192" y="29" fill="#d8b4fe" font-family="monospace" font-size="9" text-anchor="middle">Frankenstein 2026</text>
    <!-- Telemetry -->
    <text x="450" y="30" fill="#94a3b8" font-family="monospace" font-size="12">LEVEL <tspan fill="#fbbf24" font-weight="bold">4</tspan> • 1150 XP • 9/21 MASTERED</text>
    <!-- Live Demo Badge -->
    <rect x="740" y="14" width="135" height="22" rx="11" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="1"/>
    <text x="807" y="29" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">LIVE DEMO READY</text>
  </g>

  <!-- Bottom Region Quick Jump Bar -->
  <g transform="translate(320, 485)">
    <rect width="320" height="36" rx="18" fill="#0f172a" opacity="0.95" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="35" cy="18" r="4" fill="#06b6d4"/><text x="45" y="22" fill="#94a3b8" font-family="monospace" font-size="10">Frontend</text>
    <circle cx="115" cy="18" r="4" fill="#10b981"/><text x="125" y="22" fill="#94a3b8" font-family="monospace" font-size="10">Backend</text>
    <circle cx="195" cy="18" r="4" fill="#a855f7"/><text x="205" y="22" fill="#94a3b8" font-family="monospace" font-size="10">AI/ML</text>
    <circle cx="260" cy="18" r="4" fill="#f43f5e"/><text x="270" y="22" fill="#94a3b8" font-family="monospace" font-size="10">Cyber</text>
  </g>
</svg>