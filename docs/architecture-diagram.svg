<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80"/>
    <line x1="0" y1="160" x2="960" y2="160"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="320" x2="960" y2="320"/>
    <line x1="0" y1="400" x2="960" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
    <line x1="800" y1="0" x2="800" y2="480"/>
  </g>

  <!-- Title Pill -->
  <rect x="300" y="24" width="360" height="42" rx="21" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow)"/>
  <text x="480" y="50" fill="#f8fafc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="2">MINDATLAS 3D ARCHITECTURE</text>

  <!-- Central Brain / Kiro Spec Engine -->
  <g transform="translate(360, 110)">
    <rect width="240" height="90" rx="12" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glow)"/>
    <text x="120" y="36" fill="#c7d2fe" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">KIRO SPEC BRAIN</text>
    <text x="120" y="58" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">.kiro/steering • .kiro/specs</text>
    <text x="120" y="74" fill="#a5b4fc" font-family="monospace" font-size="10" text-anchor="middle">Automated Save Hooks &amp; EARS</text>
  </g>

  <!-- Connectors from Brain to Limbs -->
  <path d="M 420 200 L 200 270" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 480 200 L 480 270" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
  <path d="M 540 200 L 760 270" stroke="#34d399" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Limb 1: DAG Graph Engine (Skeleton) -->
  <g transform="translate(60, 270)">
    <rect width="260" height="170" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <circle cx="36" cy="36" r="14" fill="#0284c7" opacity="0.2"/>
    <text x="36" y="41" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1</text>
    <text x="60" y="41" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">DAG Graph Engine</text>
    <text x="24" y="70" fill="#94a3b8" font-family="monospace" font-size="11">• Topological Sort &amp; Validation</text>
    <text x="24" y="90" fill="#94a3b8" font-family="monospace" font-size="11">• 3-Color DFS Cycle Detection</text>
    <text x="24" y="110" fill="#94a3b8" font-family="monospace" font-size="11">• Dynamic Level &amp; XP Progression</text>
    <text x="24" y="130" fill="#94a3b8" font-family="monospace" font-size="11">• Multi-Format Spec Markdown Parser</text>
    <text x="24" y="150" fill="#38bdf8" font-family="monospace" font-size="10">[Discrete Math / Compiler Limb]</text>
  </g>

  <!-- Limb 2: 3D Spatial Cartography (Flesh & Eyes) -->
  <g transform="translate(350, 270)">
    <rect width="260" height="170" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="2"/>
    <circle cx="36" cy="36" r="14" fill="#d97706" opacity="0.2"/>
    <text x="36" y="41" fill="#fbbf24" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">2</text>
    <text x="60" y="41" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">Three.js Cartography</text>
    <text x="24" y="70" fill="#94a3b8" font-family="monospace" font-size="11">• 60 FPS WebGL Spatial Canvas</text>
    <text x="24" y="90" fill="#94a3b8" font-family="monospace" font-size="11">• 4 Floating Regional Islands</text>
    <text x="24" y="110" fill="#94a3b8" font-family="monospace" font-size="11">• Catmull-Rom Energy Highways</text>
    <text x="24" y="130" fill="#94a3b8" font-family="monospace" font-size="11">• Volumetric Fog &amp; Raycast Hover</text>
    <text x="24" y="150" fill="#fbbf24" font-family="monospace" font-size="10">[Video Game Engine Limb]</text>
  </g>

  <!-- Limb 3: Procedural Audio Telemetry (Voice & Pulse) -->
  <g transform="translate(640, 270)">
    <rect width="260" height="170" rx="14" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <circle cx="36" cy="36" r="14" fill="#059669" opacity="0.2"/>
    <text x="36" y="41" fill="#34d399" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">3</text>
    <text x="60" y="41" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">Web Audio Telemetry</text>
    <text x="24" y="70" fill="#94a3b8" font-family="monospace" font-size="11">• Zero External Audio Assets</text>
    <text x="24" y="90" fill="#94a3b8" font-family="monospace" font-size="11">• Region-Tuned Root Frequencies</text>
    <text x="24" y="110" fill="#94a3b8" font-family="monospace" font-size="11">• Elevation-to-Pitch Modulation</text>
    <text x="24" y="130" fill="#94a3b8" font-family="monospace" font-size="11">• Major-9th Fanfares &amp; Ambient Drone</text>
    <text x="24" y="150" fill="#34d399" font-family="monospace" font-size="10">[Modular Synth DSP Limb]</text>
  </g>
</svg>